{% extends 'base.html' %}
{% block title %}Register{% endblock %}

{% block content %}
<div class="login-box">
  <h2>Register</h2>
  <form method="post">
    <label class="form-label">Full name</label>
    <input class="form-control mb-3" name="name" required>
    <label class="form-label">Email</label>
    <input class="form-control mb-3" type="email" name="email" required>
    <label class="form-label">Password</label>
    <input class="form-control mb-3" type="password" name="password" minlength="6" required>
    <label class="form-label">I am a</label>
    <select class="form-select mb-3" name="role">
      <option value="student">Student</option>
      <option value="examiner">Examiner (needs admin approval)</option>
    </select>
    <label class="form-label">Department (for examiners)</label>
    <input class="form-control mb-3" name="department">
    <label class="form-label">Course (for students)</label>
    <input class="form-control mb-3" name="course">
    <button class="btn btn-primary w-100">Register</button>
  </form>
  <p class="mt-3">Already registered? <a href="{{ url_for('login') }}">Login</a></p>
</div>
{% endblock %}
